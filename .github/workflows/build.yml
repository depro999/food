name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Quitar transparencia de icon.png (fondo sólido)
        run: |
          python3 -c '
          from PIL import Image
          path = "Sources/Assets.xcassets/AppIcon.appiconset/icon.png"
          img = Image.open(path).convert("RGBA")
          # Cambia (0, 0, 0, 255) por (255, 255, 255, 255) si prefieres fondo blanco
          bg = Image.new("RGBA", img.size, (0, 0, 0, 255))
          out = Image.alpha_composite(bg, img).convert("RGB")
          out.save(path, "PNG")
          ' || sips -s format jpeg Sources/Assets.xcassets/AppIcon.appiconset/icon.png --out /tmp/icon.jpg && sips -s format png /tmp/icon.jpg --out Sources/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generar proyecto Xcode con XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Proyecto: $PROJECT  Esquema: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            INFOPLIST_KEY_CFBundleDisplayName="Consilium" 2>&1 | tee build.log

          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir Payload
          ditto "$APP" "Payload/$(basename "$APP")"
          zip -ry App.ipa Payload

      - name: Mostrar errores
        if: failure()
        run: grep -E "error:|BUILD FAILED" -B1 -A3 build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: App.ipa
